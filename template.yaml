AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  North West England Electricity Distribution Network
  Minimal infrastructure for Neptune Analytics graph data

  NOTE: AgentCore resources such as runtimes and gateway are deployed using their own python scripts -> CFN support for these resources was limited at the time of writing
  NOTE: review the readme to generate the network graph in csv and the AWS CLI to create and load it into Neptune Analytics, also ensure the psr_register is copied to the appropriate lambda folder and redeployed if you recreate the graph

Parameters:
  Environment:
    Type: String
    Default: test
    AllowedValues:
      - test
      - prod
    Description: Environment name for resource tagging

  NeptuneGraphId:
    Type: String
    Description: Neptune Analytics graph identifier (set after creating the graph via CLI)

Conditions:
  IsProdEnvironment: !Equals [!Ref Environment, prod]

Resources:
  # ============================================================================
  # Workforce Management System Resources
  # ============================================================================
  
  # Customer-managed encryption key for workforce database credentials.
  WorkforceDBKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts the Workforce Management database secret
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountRootAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-workforce-db-key
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: NorthWestEnglandElectricityNetwork

  # Secrets Manager secret for Aurora database credentials
  WorkforceDBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-workforce-db-credentials
      Description: Master credentials for Workforce Management Aurora database
      KmsKeyId: !GetAtt WorkforceDBKey.Arn
      GenerateSecretString:
        SecretStringTemplate: '{"username": "workforce_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
        RequireEachIncludedType: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-workforce-db-credentials
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: NorthWestEnglandElectricityNetwork

  # Aurora PostgreSQL Serverless v2 DB Subnet Group
  WorkforceDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub ${AWS::StackName}-workforce-db-subnet-group
      DBSubnetGroupDescription: Subnet group for Workforce Management Aurora cluster
      SubnetIds:
        - !Ref WorkforceDBSubnet1
        - !Ref WorkforceDBSubnet2
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-workforce-db-subnet-group
        - Key: Environment
          Value: !Ref Environment

  # VPC for Aurora cluster
  WorkforceVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-agentic-netops-vpc
        - Key: Environment
          Value: !Ref Environment

  # Subnet 1 for Aurora
  WorkforceDBSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkforceVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-workforce-db-subnet-1
        - Key: Environment
          Value: !Ref Environment

  # Subnet 2 for Aurora
  WorkforceDBSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkforceVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-workforce-db-subnet-2
        - Key: Environment
          Value: !Ref Environment

  # Security Group for Aurora cluster
  WorkforceDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${AWS::StackName}-workforce-db-sg
      GroupDescription: Security group for Workforce Management Aurora cluster
      VpcId: !Ref WorkforceVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16
          Description: Allow PostgreSQL access from within VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-workforce-db-sg
        - Key: Environment
          Value: !Ref Environment

  # Aurora PostgreSQL Serverless v2 Cluster
  WorkforceDBCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: !If [IsProdEnvironment, Retain, Delete]
    UpdateReplacePolicy: !If [IsProdEnvironment, Retain, Delete]
    Properties:
      DBClusterIdentifier: !Sub ${AWS::StackName}-workforce-db
      Engine: aurora-postgresql
      EngineVersion: '15.8'
      EngineMode: provisioned
      DatabaseName: workforce_db
      MasterUsername: !Sub '{{resolve:secretsmanager:${WorkforceDBSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${WorkforceDBSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref WorkforceDBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref WorkforceDBSecurityGroup
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 1
      EnableHttpEndpoint: true
      EnableIAMDatabaseAuthentication: true
      DeletionProtection: !If [IsProdEnvironment, true, false]
      BackupRetentionPeriod: !If [IsProdEnvironment, 7, 1]
      PreferredBackupWindow: '03:00-04:00'
      PreferredMaintenanceWindow: 'sun:04:00-sun:05:00'
      StorageEncrypted: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-workforce-db
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: NorthWestEnglandElectricityNetwork

  # Aurora PostgreSQL Serverless v2 DB Instance
  WorkforceDBInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub ${AWS::StackName}-workforce-db-instance
      DBClusterIdentifier: !Ref WorkforceDBCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-workforce-db-instance
        - Key: Environment
          Value: !Ref Environment

  # Attach secret to Aurora cluster
  WorkforceDBSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref WorkforceDBSecret
      TargetId: !Ref WorkforceDBCluster
      TargetType: AWS::RDS::DBCluster

  # IAM Role for Workforce Router Lambda
  WorkforceRouterLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-workforce-router-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RDSDataAPIAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - rds-data:ExecuteStatement
                  - rds-data:BatchExecuteStatement
                  - rds-data:BeginTransaction
                  - rds-data:CommitTransaction
                  - rds-data:RollbackTransaction
                Resource: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${WorkforceDBCluster}'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref WorkforceDBSecret
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-workforce-router-role
        - Key: Environment
          Value: !Ref Environment

  # Workforce Router Lambda Function
  WorkforceRouterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-workforce-router-tool
      Description: Routes workforce dispatch requests based on fault type and engineer skills - used as a tool by AI agents
      CodeUri: src/lambda_workforce_router/
      Handler: lambda_handler.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt WorkforceRouterLambdaRole.Arn
      Environment:
        Variables:
          DB_CLUSTER_ARN: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${WorkforceDBCluster}'
          DB_SECRET_ARN: !Ref WorkforceDBSecret
          DB_NAME: workforce_db
          LOG_LEVEL: INFO
      Tags:
        Name: !Sub ${AWS::StackName}-workforce-router
        Environment: !Ref Environment
        Project: NorthWestEnglandElectricityNetwork

  # IAM Role for Workforce Availability Simulator Lambda
  WorkforceSimulatorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-workforce-simulator-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RDSDataAPIAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - rds-data:ExecuteStatement
                  - rds-data:BatchExecuteStatement
                Resource: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${WorkforceDBCluster}'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref WorkforceDBSecret
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-workforce-simulator-role
        - Key: Environment
          Value: !Ref Environment

  # Workforce Availability Simulator Lambda Function
  WorkforceSimulatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-workforce-simulator
      Description: Simulates engineer availability changes for demo purposes
      CodeUri: src/lambda_workforce_availability_simulator/
      Handler: lambda_handler.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 60
      Role: !GetAtt WorkforceSimulatorLambdaRole.Arn
      Environment:
        Variables:
          DB_CLUSTER_ARN: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${WorkforceDBCluster}'
          DB_SECRET_ARN: !Ref WorkforceDBSecret
          DB_NAME: workforce_db
          LOG_LEVEL: INFO
      Tags:
        Name: !Sub ${AWS::StackName}-workforce-simulator
        Environment: !Ref Environment
        Project: NorthWestEnglandElectricityNetwork

  # EventBridge Rule for Workforce Availability Simulator
  WorkforceSimulatorScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-workforce-simulator-schedule
      Description: Triggers workforce availability simulator hourly
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Arn: !GetAtt WorkforceSimulatorFunction.Arn
          Id: WorkforceSimulatorTarget

  # Lambda Permission for EventBridge to invoke Workforce Simulator
  WorkforceSimulatorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WorkforceSimulatorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WorkforceSimulatorScheduleRule.Arn

  # ============================================================================
  # Neptune Graph Stop Scheduler
  # ============================================================================

  # IAM Role for Neptune Graph Stop Lambda
  NeptuneStopLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-neptune-stop-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: NeptuneGraphStopPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - neptune-graph:StopGraph
                  - neptune-graph:GetGraph
                Resource: !Sub arn:aws:neptune-graph:${AWS::Region}:${AWS::AccountId}:graph/*
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-neptune-stop-role
        - Key: Environment
          Value: !Ref Environment

  # Lambda function to stop Neptune Analytics graph nightly
  NeptuneStopFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-neptune-stop
      Description: Stops the Neptune Analytics graph nightly to reduce costs
      CodeUri: src/lambda_neptune_stop/
      Handler: lambda_handler.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt NeptuneStopLambdaRole.Arn
      Environment:
        Variables:
          GRAPH_ID: !Ref NeptuneGraphId
          LOG_LEVEL: INFO
      Tags:
        Name: !Sub ${AWS::StackName}-neptune-stop
        Environment: !Ref Environment
        Project: NorthWestEnglandElectricityNetwork

  # EventBridge rule - 10pm UK time (22:00 UTC, covers GMT; adjust to 21:00 UTC for BST if needed)
  NeptuneStopScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-neptune-stop-schedule
      Description: Triggers Neptune graph stop at 10pm UK time (22:00 UTC)
      ScheduleExpression: cron(0 22 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt NeptuneStopFunction.Arn
          Id: NeptuneStopTarget

  # Lambda permission for EventBridge to invoke Neptune Stop function
  NeptuneStopInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NeptuneStopFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NeptuneStopScheduleRule.Arn

  # Lambda function for PSR lookup
  PSRLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-psr-lookup-tool
      Description: Lookup against the PSR - Used as a tool by AI Agents
      CodeUri: src/lambda_psr_lookup_tool/
      Handler: lambda_handler.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-psr-lookup:*'
      Tags:
        Name: !Sub ${AWS::StackName}-psr-lookup
        Environment: !Ref Environment
        Project: NorthWestEnglandElectricityNetwork

  # Lambda function for postcode to geo info
  PostcodeToGeoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-postcode-to-geo-tool
      Description: Convert UK postcodes to geographic coordinates - Used as a tool by AI Agents
      CodeUri: src/lambda-postcode-to-geo-info/
      Handler: lambda_handler.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-postcode-to-geo:*'
      Tags:
        Name: !Sub ${AWS::StackName}-postcode-to-geo
        Environment: !Ref Environment
        Project: NorthWestEnglandElectricityNetwork

  # Lambda function for weather forecast
  WeatherForecastFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-weather-forecast-tool
      Description: Get 7-day weather forecast for coordinates - Used as a tool by AI Agents
      CodeUri: src/lambda-get-forecast-for-latlong/
      Handler: lambda_handler.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-weather-forecast:*'
      Tags:
        Name: !Sub ${AWS::StackName}-weather-forecast
        Environment: !Ref Environment
        Project: NorthWestEnglandElectricityNetwork

  # Lambda function for parts inventory lookup
  PartsInventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-parts-inventory-tool
      Description: Check parts inventory availability - Used as a tool by AI Agents
      CodeUri: src/lambda_parts_inventory_lookup/
      Handler: lambda_handler.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-parts-inventory:*'
      Tags:
        Name: !Sub ${AWS::StackName}-parts-inventory
        Environment: !Ref Environment
        Project: NorthWestEnglandElectricityNetwork

  # Dedicated access log bucket for Neptune import data.
  NeptuneDataAccessLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-neptune-data-access-logs
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: NorthWestEnglandElectricityNetwork

  NeptuneDataAccessLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref NeptuneDataAccessLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3ServerAccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${NeptuneDataAccessLogBucket.Arn}/access-logs/*
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:s3:::${NeptuneDataBucket}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt NeptuneDataAccessLogBucket.Arn
              - !Sub ${NeptuneDataAccessLogBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  # S3 Bucket for Neptune Analytics CSV files
  NeptuneDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${AWS::StackName}-neptune-data-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref NeptuneDataAccessLogBucket
        LogFilePrefix: access-logs/
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-neptune-data
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: NorthWestEnglandElectricityNetwork

  NeptuneDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref NeptuneDataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt NeptuneDataBucket.Arn
              - !Sub ${NeptuneDataBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  # IAM Role for Neptune Analytics to read from S3
  NeptuneAnalyticsImportRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-neptune-analytics-import
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: neptune-graph.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref NeptuneAnalyticsS3ReadPolicy
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-neptune-analytics-import
        - Key: Environment
          Value: !Ref Environment

  # IAM Policy for Neptune Analytics to read S3 bucket
  NeptuneAnalyticsS3ReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${AWS::StackName}-neptune-s3-read
      Description: Allows Neptune Analytics to read CSV files from S3 bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListBucket
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource: !GetAtt NeptuneDataBucket.Arn
          - Sid: GetObjects
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !Sub ${NeptuneDataBucket.Arn}/*

Outputs:
  # ============================================================================
  # Workforce Management System Outputs
  # ============================================================================
  
  WorkforceRouterFunctionArn:
    Description: ARN of the Workforce Router Lambda function
    Value: !GetAtt WorkforceRouterFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-WorkforceRouterFunctionArn

  WorkforceRouterFunctionName:
    Description: Name of the Workforce Router Lambda function
    Value: !Ref WorkforceRouterFunction
    Export:
      Name: !Sub ${AWS::StackName}-WorkforceRouterFunctionName

  WorkforceSimulatorFunctionArn:
    Description: ARN of the Workforce Availability Simulator Lambda function
    Value: !GetAtt WorkforceSimulatorFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-WorkforceSimulatorFunctionArn

  WorkforceSimulatorFunctionName:
    Description: Name of the Workforce Availability Simulator Lambda function
    Value: !Ref WorkforceSimulatorFunction
    Export:
      Name: !Sub ${AWS::StackName}-WorkforceSimulatorFunctionName

  WorkforceDBClusterEndpoint:
    Description: Aurora PostgreSQL cluster endpoint
    Value: !GetAtt WorkforceDBCluster.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-WorkforceDBClusterEndpoint

  WorkforceDBClusterArn:
    Description: Aurora PostgreSQL cluster ARN
    Value: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${WorkforceDBCluster}'
    Export:
      Name: !Sub ${AWS::StackName}-WorkforceDBClusterArn

  WorkforceDBName:
    Description: Workforce database name
    Value: workforce_db
    Export:
      Name: !Sub ${AWS::StackName}-WorkforceDBName

  WorkforceDBSecretArn:
    Description: ARN of the Secrets Manager secret containing database credentials
    Value: !Ref WorkforceDBSecret
    Export:
      Name: !Sub ${AWS::StackName}-WorkforceDBSecretArn

  WorkforceSimulatorScheduleRuleArn:
    Description: ARN of the EventBridge rule for workforce availability simulator
    Value: !GetAtt WorkforceSimulatorScheduleRule.Arn
    Export:
      Name: !Sub ${AWS::StackName}-WorkforceSimulatorScheduleRuleArn

  NeptuneStopFunctionArn:
    Description: ARN of the Neptune Stop Lambda function
    Value: !GetAtt NeptuneStopFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-NeptuneStopFunctionArn

  PSRLookupFunctionArn:
    Description: ARN of the PSR Lookup Lambda function
    Value: !GetAtt PSRLookupFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-PSRLookupFunctionArn

  PSRLookupFunctionName:
    Description: Name of the PSR Lookup Lambda function
    Value: !Ref PSRLookupFunction
    Export:
      Name: !Sub ${AWS::StackName}-PSRLookupFunctionName

  NeptuneDataBucketName:
    Description: S3 bucket name for Neptune Analytics CSV files
    Value: !Ref NeptuneDataBucket
    Export:
      Name: !Sub ${AWS::StackName}-NeptuneDataBucket

  NeptuneDataBucketArn:
    Description: S3 bucket ARN
    Value: !GetAtt NeptuneDataBucket.Arn
    Export:
      Name: !Sub ${AWS::StackName}-NeptuneDataBucketArn

  NeptuneAnalyticsImportRoleArn:
    Description: IAM Role ARN for Neptune Analytics to import from S3
    Value: !GetAtt NeptuneAnalyticsImportRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-NeptuneAnalyticsImportRoleArn

  Region:
    Description: AWS Region where resources are deployed
    Value: !Ref AWS::Region
    Export:
      Name: !Sub ${AWS::StackName}-Region

  Environment:
    Description: Environment name
    Value: !Ref Environment
    Export:
      Name: !Sub ${AWS::StackName}-Environment

  UploadCommand:
    Description: Command to upload CSV files to S3
    Value: !Sub aws s3 sync neptune_csv/ s3://${NeptuneDataBucket}/network/ --region ${AWS::Region}

  CreateGraphCommand:
    Description: Command to create Neptune Analytics graph
    Value: !Sub |
      aws neptune-graph create-graph \
        --graph-name nw-england-electricity-network \
        --provisioned-memory 32 \
        --region ${AWS::Region}

  ImportDataCommand:
    Description: Command to import CSV data into Neptune Analytics
    Value: !Sub |
      aws neptune-graph create-graph-using-import-task \
        --graph-name nw-england-electricity-network \
        --source s3://${NeptuneDataBucket}/network/ \
        --format CSV \
        --role-arn ${NeptuneAnalyticsImportRole.Arn} \
        --region ${AWS::Region}

  PostcodeToGeoFunctionArn:
    Description: ARN of the Postcode to Geo Lambda function
    Value: !GetAtt PostcodeToGeoFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-PostcodeToGeoFunctionArn

  PostcodeToGeoFunctionName:
    Description: Name of the Postcode to Geo Lambda function
    Value: !Ref PostcodeToGeoFunction
    Export:
      Name: !Sub ${AWS::StackName}-PostcodeToGeoFunctionName

  WeatherForecastFunctionArn:
    Description: ARN of the Weather Forecast Lambda function
    Value: !GetAtt WeatherForecastFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-WeatherForecastFunctionArn

  WeatherForecastFunctionName:
    Description: Name of the Weather Forecast Lambda function
    Value: !Ref WeatherForecastFunction
    Export:
      Name: !Sub ${AWS::StackName}-WeatherForecastFunctionName

  PartsInventoryFunctionArn:
    Description: ARN of the Parts Inventory Lambda function
    Value: !GetAtt PartsInventoryFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-PartsInventoryFunctionArn

  PartsInventoryFunctionName:
    Description: Name of the Parts Inventory Lambda function
    Value: !Ref PartsInventoryFunction
    Export:
      Name: !Sub ${AWS::StackName}-PartsInventoryFunctionName
