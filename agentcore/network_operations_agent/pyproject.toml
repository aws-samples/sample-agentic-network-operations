[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "network-operations-agent"
version = "0.1.0"
description = "Network Operations Agent for electricity distribution network queries"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro==0.15.0",
    "bedrock-agentcore==1.2.1",
    "bedrock-agentcore-starter-toolkit==0.3.0",
    "boto3==1.43.54",
    "httpx==0.28.1",
    "mcp==1.30.0",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "python-dotenv==1.2.1",
    "strands-agents[otel]==1.25.0",
    "strands-agents-tools==0.2.20",
    "requests==2.32.5",
    "python-dateutil==2.9.0.post0",
]
